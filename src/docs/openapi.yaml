      tags: [vouchers]
      summary: Grant a voucher to a customer (admin/manager)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantVoucherAdmin' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [vouchers]
      summary: List all vouchers (admin/manager, paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: status, in: query, schema: { type: string }, description: 'VoucherStatusEnum' }
        - { name: customerId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherListResponse' }
  /admin/vouchers/{id}:
    get:
      tags: [vouchers]
      summary: Get one voucher (admin/manager)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/vouchers/{id}/revoke:
    patch:
      tags: [vouchers]
      summary: Revoke an unused voucher (admin/manager)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeVoucher' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherResponse' }
  /voucher-campaigns:
    get:
      tags: [voucher-campaigns]
      summary: List running promotions (public)
      description: >
        Customer-safe campaign list — the same projection as
        `GET /voucher-campaigns/{id}`, so no `budgetVnd`, no spend counters, no
        `maxUsesTotal`, no `publicClaimCode`.


        Defaults to `status=active`, i.e. the promotions running right now, and
        never returns a campaign whose validity window has already closed (the
        lifecycle sweep is periodic, so an ACTIVE row can briefly outlive its
        `validUntil`). Pass `status=scheduled` for upcoming campaigns or
        `status=ended` for finished ones; `status=draft` is rejected with 400 so
        an unannounced promotion cannot be discovered.


        Sorted by `validUntil` ascending — the offer about to expire first.


        Listing a campaign does not make it claimable: claiming still needs the
        campaign's claim code, which this endpoint never returns.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, scheduled, paused, ended], default: active } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignPublicListResponse' }
        '400':
          description: Invalid query (e.g. `status=draft`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /voucher-campaigns/{id}:
    get:
      tags: [voucher-campaigns]
      summary: Campaign detail (public)
      description: >
        Customer-safe projection: presentation + the rules a customer needs to
        understand the offer. Commercial internals are NEVER returned — no
        `budgetVnd`, no spend counters, no `maxUsesTotal`, no `publicClaimCode`.
        A DRAFT campaign returns 404 so an unannounced promotion cannot leak.


        For rendering a wallet, prefer the `campaign` object embedded in each
        voucher from `GET /me/vouchers` — one request instead of one per card.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignPublic' }
        '404':
          description: Not found, or campaign is still a DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
  /admin/voucher-campaigns:
    post:
      tags: [voucher-campaigns]
      summary: Create a voucher campaign (admin/manager)
      description: >
        Creates the campaign in DRAFT. Nothing is issued until it is activated.
        Cross-field rules are enforced server-side: validFrom must precede
        validUntil, percent_off needs discountValue 1-100, free_service needs a
        non-empty applicableServiceTypeIds, and discountCapVnd is only valid for
        percent_off.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVoucherCampaign' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignResponse' }
        '400':
          description: Incoherent campaign rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Duplicate name or publicClaimCode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [voucher-campaigns]
      summary: List voucher campaigns (admin/manager)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, scheduled, active, paused, ended] } }
        - { name: source, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignListResponse' }
  /admin/voucher-campaigns/{id}:
    get:
      tags: [voucher-campaigns]
      summary: Get one voucher campaign (admin/manager)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      tags: [voucher-campaigns]
      summary: Edit a voucher campaign (admin/manager)
      description: >
        Partial update. Coherence is judged on the MERGED document, so a patch
        cannot leave the campaign in a state it could not have been created in.
        An ENDED campaign is immutable. Status is NOT editable here — use the
        activate/pause/end endpoints.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVoucherCampaign' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignResponse' }
        '409':
          description: Campaign already ended, or claim code taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/voucher-campaigns/{id}/activate:
    post:
      tags: [voucher-campaigns]
      summary: Activate a campaign (admin/manager)
      description: >
        DRAFT/SCHEDULED/PAUSED → ACTIVE, or → SCHEDULED when validFrom is still
        in the future. Refused once validUntil has passed.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignResponse' }
        '409':
          description: Invalid transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/voucher-campaigns/{id}/pause:
    post:
      tags: [voucher-campaigns]
      summary: Pause a campaign (admin/manager)
      description: >
        ACTIVE/SCHEDULED → PAUSED. Existing vouchers stop being redeemable while
        paused, but are not revoked.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignResponse' }
        '409':
          description: Invalid transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/voucher-campaigns/{id}/end:
    post:
      tags: [voucher-campaigns]
      summary: End a campaign (admin/manager)
      description: >
        Terminal. The campaign and its vouchers are kept as history — reporting
        reads them — so a campaign is never hard-deleted.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherCampaignResponse' }
  /admin/voucher-campaigns/{id}/stats:
    get:
      tags: [voucher-campaigns]
      summary: Campaign performance (admin/manager)
      description: >
        Voucher counts come from the vouchers themselves and money from the
        redemption records, so no figure depends on the cached counters.
        `countersInSync` reports whether those caches currently agree; run the
        `campaign-reconcile` job to repair them when it is false.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignStatsResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /internal/jobs/{name}:
    get:
      tags: [jobs]
      summary: Run a scheduled job (Vercel Cron)
      description: >
        Drives the maintenance jobs that node-cron cannot run on serverless.
        Authorised by the CRON_SECRET shared secret — either
        `Authorization: Bearer <secret>` (what Vercel Cron sends) or an
        `X-Cron-Secret` header — NOT by a user token. Returns 404 when no secret
        is configured, so the endpoint does not exist rather than existing
        unprotected. Every job is idempotent and safe to re-run.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum:
              - voucher-expiry
              - voucher-reservation-sweep
              - campaign-lifecycle
              - campaign-reconcile
              - order-expiry
              - cash-no-show
              - voucher-expiry-reminder
              - loyalty-reset-warning
              - loyalty-annual-reset
      responses:
        '200':
          description: Job finished
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { type: string, example: voucher-reservation-sweep }
                  durationMs: { type: integer, example: 42 }
                  result: { description: 'Job-specific summary' }
        '401':
          description: Missing or wrong cron secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Unknown job, or cron secret not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [jobs]
      summary: Run a scheduled job (manual trigger)
      description: Same as the GET form; provided for triggering a job by hand.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job finished
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { type: string }
                  durationMs: { type: integer }
                  result: {}
