        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGoldenHour' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoldenHourResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/golden-hours/{id}:
    patch:
      tags: [golden-hours]
      summary: Update a golden-hour window (manager/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGoldenHour' }
      responses:
        '200':
          description: OK
          content:
            application/json:
