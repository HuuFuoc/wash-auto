openapi: 3.0.3
info:
  title: WAVE / AutoWash Pro API
  version: 0.0.1
  description: REST API for the WAVE car-wash platform (Express backend).
servers:
  - url: /api
    description: Global API prefix
tags:
  - name: health
    description: Service health
  - name: auth
    description: Registration, login, token refresh, email OTP
  - name: service-types
    description: Wash service catalogue (public read, admin manage)
  - name: vehicle-types
    description: Vehicle type catalogue (public read, admin manage)
  - name: tier-configs
    description: Loyalty tier configuration (public read, admin manage)
  - name: upload
    description: Image upload (Cloudinary)
  - name: vehicles
    description: Customer vehicles (self-manage) + admin lookup
  - name: loyalty
    description: Customer loyalty account + point transactions
  - name: vouchers
    description: Customer vouchers (self-view) + admin grant/revoke
  - name: voucher-campaigns
    description: >
      Campaigns that own every voucher rule — eligibility (tier / service /
      vehicle), benefit type, stacking policy, limits and validity window.
  - name: jobs
    description: >
      Scheduled maintenance jobs, driven by Vercel Cron over HTTP because
      node-cron cannot tick on serverless. Authorised by CRON_SECRET.
  - name: shifts
    description: Staff shifts (availability + admin scheduling)
  - name: orders
    description: Bookings/orders (customer, cashier/admin, washer schedule, PayOS webhook)
  - name: work-orders
    description: Wash job tickets (cashier check-in, washer execution)
  - name: users
    description: Staff/customer account management (admin)
  - name: golden-hours
    description: Golden-hour discount windows (admin)
  - name: pricing-policy
    description: Global pricing policy (admin)
  - name: dashboard
    description: Management reporting / analytics (manager/admin)
  - name: chat
    description: AI chat assistant (public) + chat knowledge base (admin)
  - name: feedback
    description: Customer feedback/rating per completed order (customer + manager/admin)
  - name: notifications
    description: Persisted in-app notifications + realtime bell (any authenticated user)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateFeedback:
      type: object
      required: [orderId, rating]
      properties:
        orderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string, maxLength: 1000, example: 'Thợ rửa sạch, thái độ tốt.' }
    FeedbackResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        orderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        workOrderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        workOrderCode: { type: string, example: 'WO-240612-0001' }
        vehiclePlate: { type: string, example: '51K-123.45' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerName: { type: string, example: 'Nguyễn Văn A' }
        washerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        washerName: { type: string, example: 'Trần Văn B' }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string, example: 'Thợ rửa sạch, thái độ tốt.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackEligibility:
      type: object
      properties:
        eligible: { type: boolean, example: true }
        alreadyRated: { type: boolean, example: false }
        feedback:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeedbackResponse'
    FeedbackListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FeedbackResponse' }
        meta:
          type: object
          properties:
            page: { type: integer, example: 1 }
            limit: { type: integer, example: 20 }
            total: { type: integer, example: 42 }
            totalPages: { type: integer, example: 3 }
    WasherFeedbackSummary:
      type: object
      properties:
        washerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        averageRating: { type: number, format: float, example: 4.5 }
        count: { type: integer, example: 12 }
        distribution:
          type: object
          additionalProperties: { type: integer }
          example: { '1': 0, '2': 1, '3': 1, '4': 4, '5': 6 }
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Validation failed
        error:
          type: string
          example: Bad Request
    Register:
      type: object
      required: [name, phone, email, password]
      properties:
        name: { type: string, maxLength: 100, example: 'Nguyen Van A' }
        phone: { type: string, maxLength: 20, example: '0901234567' }
        email: { type: string, format: email, maxLength: 255, example: 'customer@example.com' }
        password: { type: string, minLength: 8, maxLength: 72, example: 'P@ssw0rd123' }
        dateOfBirth: { type: string, format: date, example: '1995-01-15' }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: 'customer@example.com' }
        password: { type: string, maxLength: 72, example: 'P@ssw0rd123' }
    GoogleLogin:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          maxLength: 4096
          description: >-
            The Google id_token (a JWT) the client received from Google Identity
            Services. Not an access token - only the id_token carries the signed
            identity claims the server verifies.
          example: 'eyJhbGciOiJSUzI1NiIsImtpZCI6...'
    RefreshToken:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6...' }
    OtpSend:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: 'customer@example.com' }
    OtpVerify:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, example: 'customer@example.com' }
        code: { type: string, minLength: 6, maxLength: 6, example: '123456' }
    UserResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        role: { type: string, enum: [customer, cashier, washer, manager, admin], example: customer }
        name: { type: string, example: 'Nguyen Van A' }
        phone: { type: string, example: '0901234567' }
        email: { type: string, format: email, example: 'customer@example.com' }
        avatarUrl: { type: string, example: 'https://cdn.example.com/avatar.jpg' }
        dateOfBirth: { type: string, format: date-time, example: '1995-01-15T00:00:00.000Z' }
        isActive: { type: boolean, example: true }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string, example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6...' }
        refreshToken: { type: string, example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6...' }
        user: { $ref: '#/components/schemas/UserResponse' }
    AuthPayload:
      type: object
      description: JWT access-token payload attached to req.user.
      properties:
        sub: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        email: { type: string, format: email, example: 'customer@example.com' }
        role: { type: string, enum: [customer, cashier, washer, manager, admin], example: customer }
    OtpSendResponse:
      type: object
      properties:
        message: { type: string, example: 'OTP sent if account exists' }
        token: { type: string, description: 'Present only if already verified within window', example: 'eyJhbGciOi...' }
    OtpVerifyResponse:
      type: object
      properties:
        token: { type: string, description: 'JWT scope=email_verified, 15m TTL', example: 'eyJhbGciOi...' }
    ForgotPassword:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 255, example: 'customer@example.com' }
    ResetPassword:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 255, example: 'customer@example.com' }
        code: { type: string, minLength: 6, maxLength: 6, description: 'Code mailed by POST /auth/forgot-password', example: '123456' }
        newPassword: { type: string, minLength: 8, maxLength: 72, example: 'NewStrongP@ss123' }
    MessageResponse:
      type: object
      properties:
        message: { type: string, example: 'Password reset successfully' }
    ChangeMyPassword:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, maxLength: 72, example: 'OldP@ss123' }
        newPassword: { type: string, minLength: 8, maxLength: 72, example: 'NewStrongP@ss123' }
    WasherLiveStatus:
      type: object
      properties:
        washerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        name: { type: string, example: 'Tran Van B' }
        email: { type: string, format: email, example: 'washer@washauto.local' }
        avatarUrl: { type: string, example: 'https://cdn.example.com/avatar.jpg' }
        onShift: { type: boolean, example: true }
        status: { type: string, enum: [free, assigned, in_progress], example: in_progress }
        currentWorkOrder:
          nullable: true
          type: object
          properties:
            id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
            code: { type: string, example: 'WO-240612-0001' }
            plate: { type: string, example: '51K-123.45' }
            vehicleTypeName: { type: string, example: 'SUV' }
            serviceName: { type: string, example: 'Rửa xe cơ bản' }
            status: { type: string, enum: [assigned, in_progress], example: in_progress }
            startedAt: { type: string, format: date-time, nullable: true }
            estimatedMinutes: { type: integer, example: 45 }
            stationName: { type: string, example: 'Trạm 1' }
    CreateVehicleType:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80, example: 'Motorbike' }
        description: { type: string, maxLength: 500, example: '2-wheel motor vehicles' }
    UpdateVehicleType:
      description: All CreateVehicleType fields, all optional (PartialType).
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
    SetVehicleTypeStatus:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean, example: true }
    VehicleTypeResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        name: { type: string, example: 'Motorbike' }
        description: { type: string, example: '2-wheel motor vehicles' }
        isActive: { type: boolean, example: true }
    UpdateTierConfig:
      description: Admin-tunable tier fields, all optional.
      type: object
      properties:
        minLoyaltyPoints: { type: integer, minimum: 0, example: 200 }
        bookingWindowDays: { type: integer, minimum: 0, example: 10 }
        priorityLevel: { type: integer, minimum: 0, example: 1 }
        pointsPer1000Vnd: { type: number, minimum: 0, example: 1.5 }
        discountPercent: { type: number, minimum: 0, maximum: 100, example: 5 }
        washesPerRewardVoucher:
          type: integer
          minimum: 1
          description: >
            Lowering this never destroys accumulated progress: the milestone
            check is `>=` and the threshold is subtracted on payout, so any
            surplus carries into the next voucher.
          example: 8
        voucherRewardRatePercent: { type: number, minimum: 0, maximum: 100, example: 5 }
        voucherRewardMultiplier: { type: number, minimum: 0.1, example: 1.5 }
        voucherRewardFloorVnd: { type: integer, minimum: 0, description: 'Must not exceed voucherRewardCeilVnd', example: 30000 }
        voucherRewardCeilVnd: { type: integer, minimum: 1, example: 150000 }
        minimumValidWashVnd: { type: integer, minimum: 0, example: 40000 }
        voucherExpiryDays: { type: integer, minimum: 1, example: 180 }
        birthdayVoucherVnd: { type: integer, minimum: 0, example: 100000 }
        exclusiveCampaignAccess: { type: boolean, example: true }
    SetTierConfigStatus:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean, example: true }
    TierConfigResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        tierName: { type: string, enum: [None, Bronze, Silver, Gold], example: None }
        minLoyaltyPoints: { type: integer, example: 200 }
        bookingWindowDays: { type: integer, example: 10 }
        priorityLevel: { type: integer, example: 1 }
        pointsPer1000Vnd: { type: number, example: 1.5 }
        discountPercent: { type: number, example: 5 }
        isActive: { type: boolean, example: true }
        washesPerRewardVoucher: { type: integer, description: 'Valid washes needed for a reward voucher', example: 8 }
        voucherRewardRatePercent: { type: number, description: 'Percent of accumulated spend the reward is worth', example: 5 }
        voucherRewardMultiplier: { type: number, description: 'Scales the reward. >1 rewards a higher tier more.', example: 1.5 }
        voucherRewardFloorVnd: { type: integer, example: 30000 }
        voucherRewardCeilVnd: { type: integer, example: 150000 }
        minimumValidWashVnd: { type: integer, description: 'Orders below this do not count toward the milestone', example: 40000 }
        voucherExpiryDays: { type: integer, example: 180 }
        birthdayVoucherVnd: { type: integer, description: '0 = no birthday gift', example: 100000 }
        exclusiveCampaignAccess: { type: boolean, example: true }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 3 }
    CreateVehicle:
      type: object
      required: [vehicleTypeId, licensePlate]
      properties:
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        licensePlate: { type: string, maxLength: 20, example: '51A-12345' }
        nickname: { type: string, maxLength: 60, example: 'My city ride' }
        brand: { type: string, maxLength: 60, example: 'Honda' }
        model: { type: string, maxLength: 60, example: 'Wave Alpha' }
        color: { type: string, maxLength: 40, example: 'Red' }
        isDefault: { type: boolean, example: false }
    UpdateVehicle:
      description: All optional. (Cannot change isDefault here; use set-default.)
      type: object
      properties:
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        licensePlate: { type: string, maxLength: 20, example: '51A-12345' }
        nickname: { type: string, maxLength: 60 }
        brand: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        color: { type: string, maxLength: 40 }
    VehicleResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        ownerName: { type: string, description: 'Present only on admin list', example: 'Nguyễn Văn A' }
        ownerPhone: { type: string, example: '0901234567' }
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        vehicleTypeName: { type: string, description: 'Present only when populated', example: 'Motorbike' }
        licensePlate: { type: string, example: '51A-12345' }
        nickname: { type: string, example: 'My city ride' }
        brand: { type: string, example: 'Honda' }
        model: { type: string, example: 'Wave Alpha' }
        color: { type: string, example: 'Red' }
        isDefault: { type: boolean, example: true }
        isActive: { type: boolean, example: true }
        usageCount: { type: integer, description: 'Lifetime orders with this vehicle (admin list)', example: 12 }
    VehicleListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VehicleResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    LoyaltyAccountResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        tierConfigId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        tierName: { type: string, enum: [None, Bronze, Silver, Gold], example: None }
        pointsBalance: { type: integer, description: 'Tier-qualification points. Reset each year.', example: 320 }
        successfulWashesTowardVoucher:
          type: integer
          description: >
            Washes since the last reward voucher. NOT reset annually — progress
            toward a voucher is independent of the calendar year.
          example: 3
        totalSuccessfulWashes: { type: integer, example: 13 }
        lastAnnualResetAt: { type: string, format: date-time, example: '2026-01-01T00:00:00.000Z' }
        currentTierRank: { type: integer, description: 'Rank of the current tier. Higher is better.', example: 2 }
        nextTier: { type: string, enum: [None, Bronze, Silver, Gold], description: 'Absent at the top tier', example: Gold }
        pointsToNextTier: { type: integer, description: 'Absent at the top tier', example: 180 }
        progressPercent: { type: integer, description: 'Progress through the CURRENT tier band, 0-100', example: 64 }
        washesRequiredForNextVoucher: { type: integer, example: 8 }
        washesRemainingForNextVoucher: { type: integer, example: 5 }
        estimatedNextVoucherVnd:
          type: integer
          description: >
            Estimated value of the next reward voucher, from the same formula
            that mints it. Server-computed — do not re-derive client-side.
          example: 55000
        lifetimePoints: { type: integer, description: 'Every point ever earned. Survives the annual reset.', example: 4320 }
        lifetimeSpendVnd: { type: integer, example: 8600000 }
        totalSavedVnd: { type: integer, description: 'Total VND discounts have saved this customer, all time', example: 340000 }
    LoyaltyTransactionResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        type: { type: string, example: 'earn_completed', description: 'Loyalty transaction type' }
        pointsDelta: { type: integer, example: 150 }
        balanceAfter: { type: integer, example: 350 }
        orderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        voucherId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        previousTierConfigId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        newTierConfigId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        reason: { type: string, example: 'Earned from order 6601...' }
        createdAt: { type: string, format: date-time }
    LoyaltyTransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LoyaltyTransactionResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    VoucherCampaignRules:
      type: object
      description: Fields shared by the create and update campaign payloads.
      properties:
        name: { type: string, minLength: 3, maxLength: 120, description: 'Internal name. Unique.', example: 'tet-2026-winback' }
        title: { type: string, minLength: 3, maxLength: 200, example: 'Giảm 50K mừng Tết 2026' }
        description: { type: string, maxLength: 2000 }
        terms: { type: string, maxLength: 4000 }
        imageUrl: { type: string, format: uri }
        themeColor: { type: string, description: 'Hex colour', example: '#E4572E' }
        benefitType: { type: string, enum: [fixed_amount, percent_off, free_service] }
        discountValue: { type: integer, description: 'VND for fixed_amount; percent 1-100 for percent_off; ignored by free_service.', example: 50000 }
        discountCapVnd: { type: integer, minimum: 1, description: 'percent_off only. Omit = uncapped.', example: 100000 }
        minOrderVnd: { type: integer, minimum: 0, default: 0, example: 150000 }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        stackingPolicy:
          type: string
          enum: [none, with_tier, with_promotion, with_tier_and_promotion]
          default: with_tier_and_promotion
          description: >
            Which other discounts survive alongside this voucher. Suppressing a
            component can only lower the discount — it never turns one on, so a
            campaign cannot reprice bookings outside a golden hour.
        maxUsesTotal: { type: integer, minimum: 1, description: 'Omit = unlimited.' }
        maxUsesPerCustomer: { type: integer, minimum: 1, default: 1 }
        budgetVnd: { type: integer, minimum: 1, description: 'Omit = unbudgeted.' }
        publicClaimCode: { type: string, pattern: '^[A-Z0-9]{3,20}$', description: 'Code customers type to claim from this pool. Unique across campaigns.', example: 'TET2026' }
        allowedTierIds:
          type: array
          items: { type: string }
          description: 'Tier config ids. EMPTY = every tier qualifies.'
        applicableServiceTypeIds:
          type: array
          items: { type: string }
          description: 'Service type ids. EMPTY = every service qualifies.'
        applicableVehicleTypeIds:
          type: array
          items: { type: string }
          description: 'Vehicle type ids. EMPTY = every vehicle qualifies.'
    CreateVoucherCampaign:
      allOf:
        - $ref: '#/components/schemas/VoucherCampaignRules'
        - type: object
          required: [name, title, benefitType, validFrom, validUntil]
          properties:
            source: { type: string, enum: [loyalty_milestone, admin_grant, campaign, birthday, referral, winback, legacy], default: campaign }
    UpdateVoucherCampaign:
      allOf:
        - $ref: '#/components/schemas/VoucherCampaignRules'
      description: >
        Every field optional. `status` is deliberately absent — lifecycle moves
        through the activate/pause/end endpoints.
    VoucherCampaignResponse:
      allOf:
        - $ref: '#/components/schemas/VoucherCampaignRules'
        - type: object
          properties:
            id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
            status: { type: string, enum: [draft, scheduled, active, paused, ended] }
            source: { type: string, enum: [loyalty_milestone, admin_grant, campaign, birthday, referral, winback, legacy] }
            createdAt: { type: string, format: date-time }
    VoucherCampaignListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VoucherCampaignResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    VoucherCampaignPublic:
      type: object
      description: >
        Customer-safe campaign view. Deliberately omits budgetVnd,
        redeemedVnd/redeemedCount, maxUsesTotal, createdBy, source, the internal
        name, and publicClaimCode.
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        title: { type: string, example: 'Giảm 50K mừng Tết 2026' }
        description: { type: string }
        terms: { type: string }
        imageUrl: { type: string, format: uri }
        themeColor: { type: string, description: 'Hex colour for the card', example: '#E4572E' }
        status: { type: string, enum: [scheduled, active, paused, ended], description: 'DRAFT never appears here' }
        benefitType: { type: string, enum: [fixed_amount, percent_off, free_service] }
        discountValue: { type: integer, example: 50000 }
        discountCapVnd: { type: integer, example: 100000 }
        minOrderVnd: { type: integer, example: 150000 }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
