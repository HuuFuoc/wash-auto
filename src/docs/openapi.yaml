openapi: 3.0.3
info:
  title: WAVE / AutoWash Pro API
  version: 0.0.1
  description: REST API for the WAVE car-wash platform (Express backend).
servers:
  - url: /api
    description: Global API prefix
tags:
  - name: health
    description: Service health
  - name: auth
    description: Registration, login, token refresh, email OTP
  - name: service-types
    description: Wash service catalogue (public read, admin manage)
  - name: vehicle-types
    description: Vehicle type catalogue (public read, admin manage)
  - name: tier-configs
    description: Loyalty tier configuration (public read, admin manage)
  - name: upload
    description: Image upload (Cloudinary)
  - name: vehicles
    description: Customer vehicles (self-manage) + admin lookup
  - name: loyalty
    description: Customer loyalty account + point transactions
  - name: vouchers
    description: Customer vouchers (self-view) + admin grant/revoke
  - name: shifts
    description: Staff shifts (availability + admin scheduling)
  - name: orders
    description: Bookings/orders (customer, cashier/admin, washer schedule, PayOS webhook)
  - name: work-orders
    description: Wash job tickets (cashier check-in/QC, washer execution)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Validation failed
        error:
          type: string
          example: Bad Request
    Register:
      type: object
      required: [name, phone, email, password]
      properties:
        name: { type: string, maxLength: 100, example: 'Nguyen Van A' }
        phone: { type: string, maxLength: 20, example: '0901234567' }
        email: { type: string, format: email, maxLength: 255, example: 'customer@example.com' }
        password: { type: string, minLength: 8, maxLength: 72, example: 'P@ssw0rd123' }
        dateOfBirth: { type: string, format: date, example: '1995-01-15' }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: 'customer@example.com' }
        password: { type: string, maxLength: 72, example: 'P@ssw0rd123' }
    RefreshToken:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6...' }
    OtpSend:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: 'customer@example.com' }
    OtpVerify:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, example: 'customer@example.com' }
        code: { type: string, minLength: 6, maxLength: 6, example: '123456' }
    UserResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        role: { type: string, enum: [customer, cashier, washer, manager, admin], example: customer }
        name: { type: string, example: 'Nguyen Van A' }
        phone: { type: string, example: '0901234567' }
        email: { type: string, format: email, example: 'customer@example.com' }
        avatarUrl: { type: string, example: 'https://cdn.example.com/avatar.jpg' }
        dateOfBirth: { type: string, format: date-time, example: '1995-01-15T00:00:00.000Z' }
        isActive: { type: boolean, example: true }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string, example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6...' }
        refreshToken: { type: string, example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6...' }
        user: { $ref: '#/components/schemas/UserResponse' }
    AuthPayload:
      type: object
      description: JWT access-token payload attached to req.user.
      properties:
        sub: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        email: { type: string, format: email, example: 'customer@example.com' }
        role: { type: string, enum: [customer, cashier, washer, manager, admin], example: customer }
    OtpSendResponse:
      type: object
      properties:
        message: { type: string, example: 'OTP sent if account exists' }
        token: { type: string, description: 'Present only if already verified within window', example: 'eyJhbGciOi...' }
    OtpVerifyResponse:
      type: object
      properties:
        token: { type: string, description: 'JWT scope=email_verified, 15m TTL', example: 'eyJhbGciOi...' }
    CreateVehicleType:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80, example: 'Motorbike' }
        description: { type: string, maxLength: 500, example: '2-wheel motor vehicles' }
    UpdateVehicleType:
      description: All CreateVehicleType fields, all optional (PartialType).
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
    SetVehicleTypeStatus:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean, example: true }
    VehicleTypeResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        name: { type: string, example: 'Motorbike' }
        description: { type: string, example: '2-wheel motor vehicles' }
        isActive: { type: boolean, example: true }
    UpdateTierConfig:
      description: Admin-tunable tier fields, all optional.
      type: object
      properties:
        minLoyaltyPoints: { type: integer, minimum: 0, example: 200 }
        bookingWindowDays: { type: integer, minimum: 0, example: 10 }
        priorityLevel: { type: integer, minimum: 0, example: 1 }
        pointsPer1000Vnd: { type: number, minimum: 0, example: 1.5 }
        discountPercent: { type: number, minimum: 0, maximum: 100, example: 5 }
    SetTierConfigStatus:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean, example: true }
    TierConfigResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        tierName: { type: string, enum: [None, Bronze, Silver, Gold], example: None }
        minLoyaltyPoints: { type: integer, example: 200 }
        bookingWindowDays: { type: integer, example: 10 }
        priorityLevel: { type: integer, example: 1 }
        pointsPer1000Vnd: { type: number, example: 1.5 }
        discountPercent: { type: number, example: 5 }
        isActive: { type: boolean, example: true }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 3 }
    CreateVehicle:
      type: object
      required: [vehicleTypeId, licensePlate]
      properties:
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        licensePlate: { type: string, maxLength: 20, example: '51A-12345' }
        nickname: { type: string, maxLength: 60, example: 'My city ride' }
        brand: { type: string, maxLength: 60, example: 'Honda' }
        model: { type: string, maxLength: 60, example: 'Wave Alpha' }
        color: { type: string, maxLength: 40, example: 'Red' }
        isDefault: { type: boolean, example: false }
    UpdateVehicle:
      description: All optional. (Cannot change isDefault here; use set-default.)
      type: object
      properties:
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        licensePlate: { type: string, maxLength: 20, example: '51A-12345' }
        nickname: { type: string, maxLength: 60 }
        brand: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        color: { type: string, maxLength: 40 }
    VehicleResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        ownerName: { type: string, description: 'Present only on admin list', example: 'Nguyễn Văn A' }
        ownerPhone: { type: string, example: '0901234567' }
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        vehicleTypeName: { type: string, description: 'Present only when populated', example: 'Motorbike' }
        licensePlate: { type: string, example: '51A-12345' }
        nickname: { type: string, example: 'My city ride' }
        brand: { type: string, example: 'Honda' }
        model: { type: string, example: 'Wave Alpha' }
        color: { type: string, example: 'Red' }
        isDefault: { type: boolean, example: true }
        isActive: { type: boolean, example: true }
    VehicleListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VehicleResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    LoyaltyAccountResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        tierConfigId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        tierName: { type: string, enum: [None, Bronze, Silver, Gold], example: None }
        pointsBalance: { type: integer, example: 0 }
        successfulWashesTowardVoucher: { type: integer, example: 3 }
        totalSuccessfulWashes: { type: integer, example: 13 }
        lastAnnualResetAt: { type: string, format: date-time, example: '2026-01-01T00:00:00.000Z' }
    LoyaltyTransactionResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        type: { type: string, example: 'earn_completed', description: 'Loyalty transaction type' }
        pointsDelta: { type: integer, example: 150 }
        balanceAfter: { type: integer, example: 350 }
        orderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        voucherId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        previousTierConfigId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        newTierConfigId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        reason: { type: string, example: 'Earned from order 6601...' }
        createdAt: { type: string, format: date-time }
    LoyaltyTransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LoyaltyTransactionResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    GrantVoucherAdmin:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        code: { type: string, pattern: '^[A-Z0-9-]{3,30}$', example: 'FREEWASH-KHOI' }
        discountCapVnd: { type: integer, minimum: 1, maximum: 200000, default: 100000, example: 100000 }
        expiresAt: { type: string, format: date-time, example: '2026-08-27T00:00:00.000Z' }
    RevokeVoucher:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500, example: 'Granted to wrong customer by mistake' }
    VoucherResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerName: { type: string, description: 'Present on admin list', example: 'Nguyễn Văn A' }
        customerEmail: { type: string, example: 'a@example.com' }
        code: { type: string, example: 'FREEWASH-20260527-001' }
        type: { type: string, description: 'VoucherTypeEnum', example: 'free_wash' }
        status: { type: string, description: 'VoucherStatusEnum', example: 'unused' }
        discountCapVnd: { type: integer, example: 100000 }
        expiresAt: { type: string, format: date-time, example: '2026-08-25T00:00:00.000Z' }
        grantedReason: { type: string, example: 'Reward for 10 completed washes' }
        usedAt: { type: string, format: date-time, example: '2026-06-01T08:00:00.000Z' }
        usedOrderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        createdAt: { type: string, format: date-time }
    VoucherListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/VoucherResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    CreateStaffShift:
      type: object
      required: [staffId, shiftType, date, block]
      properties:
        staffId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        shiftType: { type: string, description: 'ShiftTypeEnum', example: 'washer' }
        stationName: { type: string, maxLength: 80, example: 'Bay 1' }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: '2026-06-01' }
        block: { type: string, description: 'morning | afternoon | fullday', example: 'morning' }
        note: { type: string, maxLength: 500, example: 'Morning shift' }
    UpdateStaffShift:
      description: All optional. Provide date + block together to reschedule.
      type: object
      properties:
        staffId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        shiftType: { type: string, example: 'washer' }
        stationName: { type: string, maxLength: 80, example: 'Bay 1' }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: '2026-06-01' }
        block: { type: string, example: 'morning' }
        note: { type: string, maxLength: 500 }
    SetStaffShiftStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, description: 'scheduled|active|completed|cancelled', example: 'active' }
    StaffShiftResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        staffId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        shiftType: { type: string, example: 'washer' }
        stationName: { type: string, example: 'Bay 1' }
        startAt: { type: string, format: date-time, example: '2026-06-01T08:00:00.000Z' }
        endAt: { type: string, format: date-time, example: '2026-06-01T12:00:00.000Z' }
        status: { type: string, example: 'scheduled' }
        note: { type: string, example: 'Morning shift' }
    StaffShiftListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StaffShiftResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    CreateOrder:
      type: object
      required: [serviceTypeId, scheduledAt, paymentMethod]
      properties:
        vehicleId: { type: string, description: 'Existing vehicle. Provide this OR vehicle.', example: '6601e3b3f1a2c3a4b5d6e7f8' }
        vehicle: { $ref: '#/components/schemas/CreateVehicle' }
        serviceTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        scheduledAt: { type: string, format: date-time, example: '2026-05-18T01:30:00.000Z' }
        paymentMethod: { type: string, enum: [online, cash], example: online }
        note: { type: string, maxLength: 500, example: 'Hut bui ky phan ghe sau.' }
        voucherId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
    PreviewOrder:
      type: object
      required: [serviceTypeId, vehicleTypeId, scheduledAt]
      properties:
        serviceTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        scheduledAt: { type: string, format: date-time, example: '2026-06-01T01:30:00.000Z' }
        voucherId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
    PreviewOrderResponse:
      type: object
      properties:
        originalAmount: { type: integer, example: 150000 }
        estimatedMinutes: { type: integer, example: 30 }
        discountAmount: { type: integer, example: 15000 }
        discountPercent: { type: integer, example: 10 }
        discountReason: { type: string, example: 'golden_hour:Bronze+voucher:FREEWASH-...' }
        amount: { type: integer, example: 135000 }
        isGoldenHour: { type: boolean, example: true }
        tierName: { type: string, example: Bronze }
        tierDiscountPercent: { type: integer, example: 5 }
        voucherDiscountCapVnd: { type: integer, example: 100000 }
        voucherError: { type: string, example: 'Voucher is expired' }
    AvailableSlot:
      type: object
      properties:
        scheduledAt: { type: string, format: date-time, example: '2026-06-01T09:00:00.000Z' }
        remainingCapacity: { type: integer, example: 3 }
        isGoldenHour: { type: boolean, example: true }
        discountPercent: { type: integer, example: 5 }
    RescheduleOrder:
      type: object
      required: [staffShiftId, scheduledAt]
      properties:
        staffShiftId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        scheduledAt: { type: string, format: date-time, example: '2026-06-02T10:00:00.000Z' }
    CancelOrder:
      type: object
      properties:
        reason: { type: string, maxLength: 500, example: 'Khach ban dot xuat' }
    UpdateOrderStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending_payment, confirmed, checked_in, in_progress, completed, cancelled, no_show]
          example: checked_in
        reason: { type: string, maxLength: 500, description: 'Required for cancelled/no_show', example: 'Customer no longer interested' }
    OrderResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        vehicleId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        serviceTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        customerName: { type: string, description: 'Present only when populated', example: 'Nguyễn Văn A' }
        customerEmail: { type: string, example: 'a@example.com' }
        licensePlate: { type: string, example: '51T-56019' }
        serviceName: { type: string, example: 'Premium Wash' }
        staffShiftId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        scheduledAt: { type: string, format: date-time, example: '2026-06-01T09:00:00.000Z' }
        estimatedMinutes: { type: integer, example: 30 }
        status:
          type: string
          enum: [pending_payment, confirmed, checked_in, in_progress, completed, cancelled, no_show]
          example: confirmed
        paymentMethod: { type: string, enum: [online, cash], example: online }
        paymentStatus: { type: string, enum: [unpaid, paid, refunded], example: paid }
        amount: { type: integer, example: 150000 }
        originalAmount: { type: integer, example: 150000 }
        discountAmount: { type: integer, example: 15000 }
        discountPercent: { type: integer, example: 10 }
        discountReason: { type: string, example: 'golden_hour:Bronze' }
        voucherId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        priorityLevel: { type: integer, example: 0 }
        rescheduleCount: { type: integer, example: 0 }
        cancelReason: { type: string, example: 'Khach ban dot xuat' }
        note: { type: string, example: 'Hut bui ky phan ghe sau.' }
        payosCheckoutUrl: { type: string, example: 'https://pay.payos.vn/web/...' }
        payosOrderCode: { type: integer, example: 1716800000001 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrderResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    WasherScheduleItem:
      type: object
      properties:
        bookingId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        scheduledAt: { type: string, format: date-time, example: '2026-06-16T09:00:00.000Z' }
        status:
          type: string
          enum: [pending_payment, confirmed, checked_in, in_progress, completed, cancelled, no_show]
          example: confirmed
        service:
          type: object
          properties:
            name: { type: string, example: 'Premium Wash' }
            durationMinutes: { type: integer, example: 30 }
        customer:
          type: object
          properties:
            name: { type: string, example: 'Nguyễn Văn A' }
            phone: { type: string, example: '0901234567' }
        vehicle:
          type: object
          properties:
            licensePlate: { type: string, example: '51T-56019' }
        location: { type: string, example: 'Bay 2' }
        paymentStatus: { type: string, enum: [unpaid, paid, refunded], example: paid }
    CreateWorkOrder:
      type: object
      required: [orderId]
      properties:
        orderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        checkinPhotos:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
          example: ['https://cdn.example.com/checkin/abc-front.jpg']
    AssignWasher:
      type: object
      required: [washerId]
      properties:
        washerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
    QcWorkOrder:
      type: object
      required: [passed]
      properties:
        passed: { type: boolean, description: 'true=DONE, false=RETURNED', example: true }
        note: { type: string, maxLength: 500, example: 'Còn vết nước ở kính sau, làm lại.' }
    FinishWorkOrder:
      type: object
      required: [checkoutPhotos]
      properties:
        checkoutPhotos:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri }
          example: ['https://cdn.example.com/checkout/abc-front.jpg']
    WorkOrderResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        orderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        code: { type: string, example: 'WO-20260522-001' }
        vehicleSnapshot:
          type: object
          properties:
            plate: { type: string, example: '51A-12345' }
            vehicleTypeName: { type: string, example: 'Motorbike' }
            color: { type: string, example: 'Red' }
        serviceName: { type: string, example: 'Standard Wash' }
        scheduledAt: { type: string, format: date-time, example: '2026-05-22T09:00:00.000Z' }
        preferredWasherId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        checkinPhotos: { type: array, items: { type: string, format: uri } }
        checkoutPhotos: { type: array, items: { type: string, format: uri } }
        status: { type: string, description: 'WorkOrderStatusEnum', example: 'waiting' }
        assignedWasherId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        assignedWasherName: { type: string, example: 'Trần Văn B' }
        assignedBy: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        estimatedMinutes: { type: integer, example: 30 }
        stationName: { type: string, example: 'Bay 1' }
        startedAt: { type: string, format: date-time, example: '2026-05-22T09:00:00.000Z' }
        finishedAt: { type: string, format: date-time, example: '2026-05-22T09:25:00.000Z' }
        qcBy: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        qcAt: { type: string, format: date-time, example: '2026-05-22T09:30:00.000Z' }
        qcPassed: { type: boolean, example: true }
        qcNote: { type: string, example: 'Còn vết nước ở kính sau.' }
        returnCount: { type: integer, example: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkOrderListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkOrderResponse' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    VehiclePricing:
      type: object
      required: [vehicleTypeId, price, estimatedMinutes]
      properties:
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        price: { type: number, example: 60000 }
        estimatedMinutes: { type: integer, example: 30 }
        isActive: { type: boolean, default: true, example: true }
    CreateServiceType:
      type: object
      required: [name, basePrice, estimatedMinutes, pointsMultiplier]
      properties:
        name: { type: string, maxLength: 120, example: 'Premium Wash' }
        description:
          { type: string, maxLength: 500, example: 'Exterior + interior + tire shine' }
        basePrice: { type: number, example: 80000 }
        estimatedMinutes: { type: integer, example: 30 }
        pointsMultiplier: { type: number, example: 1.5 }
        checklistTemplate:
          type: array
          items: { type: string }
          example: ['Rửa thân xe', 'Hút bụi nội thất']
        isVoucherEligible: { type: boolean, default: true, example: true }
        vehiclePricing:
          type: array
          items: { $ref: '#/components/schemas/VehiclePricing' }
    UpdateServiceType:
      description: All CreateServiceType fields, all optional (PartialType).
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        basePrice: { type: number }
        estimatedMinutes: { type: integer }
        pointsMultiplier: { type: number }
        checklistTemplate: { type: array, items: { type: string } }
        isVoucherEligible: { type: boolean }
        vehiclePricing:
          type: array
          items: { $ref: '#/components/schemas/VehiclePricing' }
    SetServiceTypeStatus:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean, example: true }
    VehiclePricingResponse:
      type: object
      properties:
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        vehicleTypeName: { type: string, example: 'Sedan 4 chỗ' }
        price: { type: string, example: '60000' }
        estimatedMinutes: { type: integer, example: 30 }
        isActive: { type: boolean, example: true }
    ServiceTypeResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        name: { type: string, example: 'Premium Wash' }
        description: { type: string, example: 'Exterior + interior + tire shine' }
        basePrice: { type: string, example: '80000' }
        estimatedMinutes: { type: integer, example: 30 }
        pointsMultiplier: { type: number, example: 1.5 }
        checklistTemplate: { type: array, items: { type: string } }
        isVoucherEligible: { type: boolean, example: true }
        vehiclePricing:
          type: array
          items: { $ref: '#/components/schemas/VehiclePricingResponse' }
        isActive: { type: boolean, example: true }
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Register' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for new tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid/expired refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '204':
          description: No Content
  /auth/otp/send:
    post:
      tags: [auth]
      summary: Send an email verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSend' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSendResponse' }
  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify an email OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400':
          description: Invalid/expired code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/me:
    get:
      tags: [auth]
      summary: Current token payload
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPayload' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
