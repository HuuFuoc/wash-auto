        maxStackedDiscountPercent: { type: integer, minimum: 0, maximum: 100, example: 50 }
    PricingPolicyResponse:
      type: object
      properties:
        maxStackedDiscountPercent: { type: integer, example: 50 }
        updatedAt: { type: string, format: date-time }
    SendMessage:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1000, example: 'Cho tôi xem danh sách dịch vụ rửa xe đang có' }
        sessionId: { type: string, maxLength: 64, example: 'b3c7e0f4-9e6e-4c2d-aab2-08d3c1c0b1a2' }
    ChatResponse:
      type: object
      properties:
        sessionId: { type: string, example: 'b3c7e0f4-9e6e-4c2d-aab2-08d3c1c0b1a2' }
        reply: { type: string, example: 'Cửa hàng đang có 3 gói: Rửa cơ bản, Premium, Detailing.' }
        toolsCalled: { type: array, items: { type: string }, example: ['list_services'] }
    CreateChatKnowledge:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 3, maxLength: 300, example: 'Cửa hàng mở cửa lúc mấy giờ?' }
        answer: { type: string, minLength: 3, maxLength: 2000, example: 'Wash-Auto mở cửa 07:00 - 21:00 mỗi ngày.' }
        keywords:
          type: array
          maxItems: 20
          items: { type: string }
          example: ['giờ mở cửa', 'opening hours']
        category: { type: string, maxLength: 50, example: 'policy' }
    UpdateChatKnowledge:
      description: All CreateChatKnowledge fields optional, plus isActive.
      type: object
      properties:
        question: { type: string, minLength: 3, maxLength: 300 }
        answer: { type: string, minLength: 3, maxLength: 2000 }
        keywords: { type: array, items: { type: string } }
        category: { type: string, maxLength: 50 }
        isActive: { type: boolean, example: true }
    ChatKnowledgeResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        question: { type: string, example: 'Cửa hàng mở cửa lúc mấy giờ?' }
        answer: { type: string, example: 'Wash-Auto mở cửa 07:00 - 21:00 mỗi ngày.' }
        keywords: { type: array, items: { type: string }, example: ['giờ mở cửa'] }
        category: { type: string, example: 'policy' }
        isActive: { type: boolean, example: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehiclePricing:
      type: object
      required: [vehicleTypeId, price, estimatedMinutes]
      properties:
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        price: { type: number, example: 60000 }
        estimatedMinutes: { type: integer, example: 30 }
        isActive: { type: boolean, default: true, example: true }
    CreateServiceType:
      type: object
      required: [name, basePrice, estimatedMinutes, pointsMultiplier]
      properties:
        name: { type: string, maxLength: 120, example: 'Premium Wash' }
        description:
          { type: string, maxLength: 500, example: 'Exterior + interior + tire shine' }
        basePrice: { type: number, example: 80000 }
        estimatedMinutes: { type: integer, example: 30 }
        pointsMultiplier: { type: number, example: 1.5 }
        checklistTemplate:
          type: array
          items: { type: string }
          example: ['Rửa thân xe', 'Hút bụi nội thất']
        isVoucherEligible: { type: boolean, default: true, example: true }
        vehiclePricing:
          type: array
          items: { $ref: '#/components/schemas/VehiclePricing' }
    UpdateServiceType:
      description: All CreateServiceType fields, all optional (PartialType).
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        basePrice: { type: number }
        estimatedMinutes: { type: integer }
        pointsMultiplier: { type: number }
        checklistTemplate: { type: array, items: { type: string } }
        isVoucherEligible: { type: boolean }
        vehiclePricing:
          type: array
          items: { $ref: '#/components/schemas/VehiclePricing' }
    SetServiceTypeStatus:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean, example: true }
    VehiclePricingResponse:
      type: object
      properties:
        vehicleTypeId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        vehicleTypeName: { type: string, example: 'Sedan 4 chỗ' }
        price: { type: string, example: '60000' }
        estimatedMinutes: { type: integer, example: 30 }
        isActive: { type: boolean, example: true }
    ServiceTypeResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        name: { type: string, example: 'Premium Wash' }
        description: { type: string, example: 'Exterior + interior + tire shine' }
        basePrice: { type: string, example: '80000' }
        estimatedMinutes: { type: integer, example: 30 }
        pointsMultiplier: { type: number, example: 1.5 }
        checklistTemplate: { type: array, items: { type: string } }
        isVoucherEligible: { type: boolean, example: true }
        vehiclePricing:
          type: array
          items: { $ref: '#/components/schemas/VehiclePricingResponse' }
        isActive: { type: boolean, example: true }
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a customer account
      description: >-
        The account is created INACTIVE (`isActive: false`) and a verification
        code is mailed straight away. POST /auth/otp/verify is what activates it;
        until then POST /auth/login answers 403 for the correct password.


        Signing in with Google on the same address activates the account too -
        Google proves the same mailbox the code would have.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Register' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: >-
            Correct password, but the account has not verified its email yet.
            Send the user to the OTP screen; POST /auth/otp/send mails a new
            code. A deactivated account gets 401, not this - the unverified
            state is only disclosed once the password proves who is asking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/google:
    post:
      tags: [auth]
      summary: Sign in / sign up with a Google id_token (SPA flow)
      description: >-
        For a frontend using Google Identity Services, which already holds a
        signed id_token. Registers the account on first use and logs it in on
        every later call - there is no separate Google sign-up endpoint.


        The server verifies Google's signature, the expiry, the issuer and that
        the token's audience is this app's client id, and refuses any profile
        whose email Google has not verified.


        Account matching, in order: Google `sub` -> existing email (the two are
        linked, since Google proved the same mailbox) -> new CUSTOMER. A new
        account is created already email-verified but with NO phone and NO
        password; the client should collect a phone via PATCH /me/profile before
        the first booking, and POST /auth/forgot-password is how a password gets
        added later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleLogin' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid Google token, unverified Google email, or deactivated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Email already linked to a different Google account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Google sign-in is not configured (GOOGLE_* env vars missing)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [auth]
      summary: Start the Google redirect flow (browser)
      description: >-
        Navigate the BROWSER here (a plain link, not fetch - the response is a
        302 to Google's consent screen and CORS does not apply). A single-use
        `state` nonce is stored server-side for 10 minutes and checked on the way
        back, so a callback this server did not start is rejected.
      parameters:
        - in: query
          name: redirect
          required: false
          schema: { type: string }
          description: >-
            Where to land after login. Must resolve to the FRONTEND_URL origin -
            anything else is silently replaced by the default
            `{FRONTEND_URL}/auth/google/callback`, because this URL carries
            session tokens.
          example: 'https://wave-wash.vercel.app/dashboard'
      responses:
        '302':
          description: Redirect to Google's consent screen
          headers:
            Location:
              schema: { type: string }
              description: 'https://accounts.google.com/o/oauth2/v2/auth?...'
        '503':
          description: Google sign-in is not configured (GOOGLE_* env vars missing)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/google/callback:
    get:
      tags: [auth]
      summary: Google redirect-flow callback (browser)
      description: >-
        Google sends the browser here; this is the URL registered as
        GOOGLE_CALLBACK_URL. Never called by application code.


        Always answers 302, never JSON - the caller is a browser mid-navigation,
        so failures come back as a redirect too. Tokens are returned in the URL
        FRAGMENT rather than the query string, so they are never transmitted to
        the frontend's server and stay out of its access logs and the Referer
        header. Read them client-side from `window.location.hash`.


        Success: `{redirect}#accessToken=...&refreshToken=...`

        Failure: `{redirect}#error=<message>`
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
          description: One-time authorization code issued by Google.
        - in: query
          name: state
          required: false
          schema: { type: string }
          description: The nonce from GET /auth/google. Single-use; a replay fails.
        - in: query
          name: error
          required: false
          schema: { type: string }
          description: Set by Google when the user cancels the consent screen.
      responses:
        '302':
          description: Redirect back to the frontend, with tokens or an error in the fragment
          headers:
            Location:
              schema: { type: string }
              description: '{redirect}#accessToken=...&refreshToken=... or {redirect}#error=...'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for new tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid/expired refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '204':
          description: No Content
  /auth/otp/send:
    post:
      tags: [auth]
      summary: Send an email verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSend' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSendResponse' }
  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify an email OTP code
      description: >-
        Doubles as account activation: an account created by POST /auth/register
        is switched on (`isActive: true`) the first time it passes this check.
        Later calls only refresh the verification timestamp. An account an admin
        deactivated is NOT revived here - it answers 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400':
          description: Invalid/expired code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Mail a password-reset code
      description: >-
        Always answers 200 with the same message whether or not the address has
        an account, so it cannot be used to enumerate users. Throttled to 5
        requests per hour per email address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPassword' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'If an account exists for that email, a reset code has been sent' }
        '429':
          description: Too many reset requests for this email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Set a new password using a reset code
      description: >-
        Consumes the single-use code from /auth/forgot-password. Five wrong
        attempts burn the code. On success every refresh token issued to the
        account before now is revoked, so other sessions must log in again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPassword' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Invalid/expired code or validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/me:
    get:
      tags: [auth]
      summary: Current token payload
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPayload' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/admin-only:
    get:
      tags: [auth]
      summary: Admin-only probe (role guard demo)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  user: { $ref: '#/components/schemas/AuthPayload' }
        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
