        countersInSync: { type: boolean, description: 'False → run the campaign-reconcile job', example: true }
    GrantVoucherAdmin:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        code: { type: string, pattern: '^[A-Z0-9-]{3,30}$', description: 'Omit to auto-generate a random code.', example: 'FREEWASH-KHOI' }
        discountCapVnd: { type: integer, minimum: 1, maximum: 200000, default: 100000, example: 100000 }
        expiresAt: { type: string, format: date-time, example: '2026-08-27T00:00:00.000Z' }
        reason: { type: string, minLength: 5, maxLength: 500, description: 'Why this grant happened. Stored on the voucher for audit.', example: 'Đền bù khiếu nại đơn #1234' }
    RevokeVoucher:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500, example: 'Granted to wrong customer by mistake' }
    BulkCreateVoucher:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 1000, example: 100 }
        prefix: { type: string, pattern: '^[A-Z0-9]{1,15}$', description: 'Codes become PREFIX-XXXXXXXXXX (random suffix, not sequential)', example: 'TET2026' }
        discountCapVnd: { type: integer, minimum: 1, maximum: 200000, default: 100000, example: 100000 }
        expiresAt: { type: string, format: date-time, example: '2026-12-31T00:00:00.000Z' }
        reason: { type: string, minLength: 5, maxLength: 500, description: 'Stored on every voucher in the batch. Defaults to "Lô phát hành <PREFIX>".', example: 'Chiến dịch Tết 2026' }
    BulkVoucherResult:
      type: object
      properties:
        count: { type: integer, example: 100 }
        vouchers:
          type: array
          items: { $ref: '#/components/schemas/VoucherResponse' }
    ClaimVoucher:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Z0-9-]{3,40}$', description: 'Case-insensitive; whitespace is stripped before lookup.', example: 'TET2026-4KP9XM2A7B' }
    VoucherResponse:
      type: object
      properties:
        id: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        campaignId:
          type: string
          description: >
            Campaign whose rules govern this voucher. Absent only on rows the
            backfill migration has not reached, which fall back to legacy
            behaviour (voucher cap, no eligibility restrictions).
          example: '6601e3b3f1a2c3a4b5d6e7f8'
        customerId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        campaign:
          allOf: [{ $ref: '#/components/schemas/VoucherCampaignPublic' }]
          description: >
            Campaign presentation + rules, EMBEDDED so a wallet renders from one
            request instead of a lookup per card. Absent on rows the backfill
            has not reached.
        customerName: { type: string, description: 'Present on admin list', example: 'Nguyễn Văn A' }
        customerEmail: { type: string, example: 'a@example.com' }
        code: { type: string, example: 'FREEWASH-4KP9XM2A7B' }
        type: { type: string, description: 'VoucherTypeEnum', example: 'free_wash' }
        status:
          type: string
          enum: [unused, reserved, used, expired, revoked]
          description: >
            VoucherStatusEnum. `reserved` = held for one in-flight order.
            `revoked` = killed early by an admin; it is NOT reported as `expired`.
          example: 'unused'
        discountCapVnd: { type: integer, example: 100000 }
        expiresAt: { type: string, format: date-time, example: '2026-08-25T00:00:00.000Z' }
        grantedReason: { type: string, example: 'Thưởng mốc 10 lượt rửa hợp lệ' }
        grantedSource:
          type: string
          enum: [loyalty_milestone, admin_grant, campaign, birthday, referral, winback, legacy]
          description: 'Acquisition channel. Absent on vouchers minted before this was tracked.'
          example: 'loyalty_milestone'
        grantedAt: { type: string, format: date-time, example: '2026-05-27T08:00:00.000Z' }
        usedAt: { type: string, format: date-time, example: '2026-06-01T08:00:00.000Z' }
        usedOrderId: { type: string, example: '6601e3b3f1a2c3a4b5d6e7f8' }
        reservedOrderId: { type: string, description: 'Set while status is reserved', example: '6601e3b3f1a2c3a4b5d6e7f8' }
        reservedUntil: { type: string, format: date-time, example: '2026-06-01T08:15:00.000Z' }
        revokedAt: { type: string, format: date-time, example: '2026-06-02T09:00:00.000Z' }
        revokeReason: { type: string, example: 'Granted to the wrong customer' }
        createdAt: { type: string, format: date-time }
