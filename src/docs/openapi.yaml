          application/json:
            schema: { $ref: '#/components/schemas/CreateStaffShift' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/StaffShiftResponse' }
                  - type: array
