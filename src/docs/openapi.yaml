        - { name: search, in: query, schema: { type: string }, description: 'name/email/phone' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
    post:
      tags: [users]
      summary: Create a staff/customer account (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
